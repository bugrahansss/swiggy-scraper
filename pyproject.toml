[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swiggy-scraper"
version = "0.1.0"
description = "Scrape Swiggy dishes, restaurants and full menus (prices, variants, ratings, delivery time, FSSAI licence) with Python."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Buğrahan Saka" }]
keywords = ["swiggy", "web scraping", "food delivery", "restaurant menu", "scraper", "aws waf", "india"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://github.com/bugrahansss/swiggy-scraper"
Source = "https://github.com/bugrahansss/swiggy-scraper"
Issues = "https://github.com/bugrahansss/swiggy-scraper/issues"
"Scrape.do" = "https://scrape.do/?utm_source=pypi&utm_medium=package&utm_campaign=swiggy-scraper"

[project.scripts]
swiggy-scraper = "swiggy_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
